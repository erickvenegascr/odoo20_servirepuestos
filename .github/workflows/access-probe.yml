name: Access read-only probe
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - run: mvn --batch-mode -f gateway/access-probe/pom.xml clean verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: PYTHONPATH=gateway python -m unittest discover -s gateway/access-probe/tests -v
